spring.application.name=fst-api

# Puerto distinto del backend de Flask (8000) para poder comparar los dos lado a lado.
server.port=8082

# La misma base que usa el backend de Python.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fst}
spring.datasource.username=${DB_USER:fst}
spring.datasource.password=${DB_PASSWORD:fst}

# IMPORTANTE: el esquema lo creó SQLAlchemy. "validate" comprueba que el mapeo de
# JPA coincide con las tablas que ya existen y no altera nada. Nunca "update" aquí.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# Límite de subida equivalente a UPLOAD_MAX_MB del backend de Flask.
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

app.data-dir=${DATA_DIR:./data}

springdoc.swagger-ui.path=/documentacion/swagger-ui.html
