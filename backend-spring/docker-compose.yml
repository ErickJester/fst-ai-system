# Backend FST en Spring Boot con su propia base: el compose de DESARROLLO. Nombre de proyecto aparte (fst-spring)
# y puerto 5433 para no mezclarse con el definitivo, el docker-compose.yml de la raíz (proyecto fst-portable, que
# se levanta con portable\iniciar.bat).
#
#   cp .env.example .env
#   docker compose --profile dev up --build      (con MailHog: correos en http://localhost:8025)
#
# El esquema (db/init) solo se aplica la primera vez, con el volumen pgdata vacío. Para volver a
# aplicarlo: docker compose down -v, que BORRA todos los datos.
name: fst-spring

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fst}
      POSTGRES_DB: ${POSTGRES_DB:-fst}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ARCHIVOS_DIR: /data/archivos
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      # Swagger prendido en desarrollo (en el compose de la raíz, el definitivo, va en false).
      SWAGGER_HABILITADO: "true"
      # true: herramientas de desarrollo (cronómetro y tiempos, banner BETA). false (lo normal) las apaga.
      MODO_DESARROLLADOR: ${MODO_DESARROLLADOR:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - videos_reportes:/data/archivos
    ports:
      - "8084:8084"

  # Worker (../worker): analiza los videos con el modelo de fst_auto (../pipeline) y guarda los
  # resultados en la misma base y el mismo volumen que el backend. El contexto del build es la raíz del
  # repositorio, porque la imagen copia ../worker y ../pipeline. El modelo
  # (fst_cnn_seg.pt) NO va en la imagen ni en git: está en ../modelos y se monta de solo lectura.
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ARCHIVOS_DIR: /data/archivos
      MODELO_CNN: /data/modelos/fst_cnn_seg.pt
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      # Nombre de esta computadora para los reportes de tiempos (opcional; vacío = el modelo del procesador).
      EQUIPO_NOMBRE: ${EQUIPO_NOMBRE:-}
      # Con false el worker no escribe tiempos.json (el avance de 0 a 100 % sí se escribe siempre).
      MODO_DESARROLLADOR: ${MODO_DESARROLLADOR:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - videos_reportes:/data/archivos
      - ../modelos:/data/modelos:ro
      # Respaldos diarios de la base (pg_dump, D-18): una carpeta del equipo (backend-spring/respaldos), fuera de los volúmenes.
      - ./respaldos:/data/respaldos

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["dev"]
    ports:
      - "1025:1025"   # SMTP, para cuando el backend corre fuera de Docker
      - "8025:8025"   # bandeja de correos de prueba

volumes:
  pgdata:
  videos_reportes:   # videos, copias para revisión, pausas y diagnósticos; compartido backend y worker
