# Configuración del backend FST. Las expresiones ${NOMBRE:valor} significan "usa la variable de entorno
# NOMBRE y, si no existe, usa valor". Los nombres de las variables son los de la guía (.env.example).

spring.application.name=fst-backend
# 8084 y no 8080 porque el 8080 lo usa CVAT (Traefik) en la máquina de desarrollo.
server.port=${SERVER_PORT:8084}

# --- Base de datos: PostgreSQL ---
# Sin Docker para el backend, apunta al contenedor db publicado en el puerto 5433 de la máquina.
# Dentro de docker compose, DB_HOST=db y DB_PORT=5432.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:fst}
spring.datasource.username=${POSTGRES_USER:fst}
spring.datasource.password=${POSTGRES_PASSWORD:fst}

# Diferencia con la práctica: allá Hibernate creaba la tabla (ddl-auto=update). Aquí el esquema lo crea
# db/init/001_esquema.sql (dominios, CHECK y llaves foráneas que Hibernate no sabe generar), y "validate"
# solo comprueba al arrancar que las 12 entidades coinciden con las tablas. Si no coinciden, no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Migraciones para bases que ya existen (initdb solo corre con el volumen vacío). Spring corre este script en cada
# arranque, ANTES de que Hibernate valide (ddl-auto=validate); es idempotente (ADD COLUMN IF NOT EXISTS). Sin Flyway.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migraciones.sql

# Igual que en la práctica: cada columna lleva exactamente el nombre de su @Column. Como PostgreSQL guarda
# en minúsculas los nombres sin comillas, las entidades declaran los nombres en minúsculas (idinstitucional).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Raíz del volumen videos_reportes (videos, copias para revisión, pausas y diagnósticos), compartido con el
# worker. Las rutas que se guardan en la base son relativas a ella (videos/{idVideo}.mp4).
app.archivos.raiz=${ARCHIVOS_DIR:/data/archivos}

# Límite de subida de archivos (MAX_UPLOAD_MB de la guía).
# location: dónde deja Spring la subida mientras llega. Dentro del mismo volumen que el destino, para que un
# video de 1 GB no pase por el /tmp del contenedor y luego se copie: VideoServiceImpl lo mueve a su lugar.
spring.servlet.multipart.location=${app.archivos.raiz}/tmp
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:2048}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_MB:2048}MB
# Sin esto, cuando el archivo pasa del límite Tomcat corta la conexión en lugar de leer (y tirar) el resto
# de la petición, y el cliente nunca recibe el 413 de ManejadorErrores. -1 = sin tope para descartar.
server.tomcat.max-swallow-size=-1

# devtools pone estas dos en "always" en desarrollo y los errores que ocurren antes de llegar a un
# controller (y por eso no pasan por ManejadorErrores) salían con el trace y el mensaje de la excepción.
server.error.include-stacktrace=never
server.error.include-message=never

# --- Modo desarrollador y versión ---
# MODO_DESARROLLADOR=true muestra herramientas de desarrollo (cronómetro y tiempos de cada análisis, banner BETA);
# false para el uso normal del laboratorio. La web lo pregunta en GET /health, sin recompilar.
app.modo-desarrollador=${MODO_DESARROLLADOR:false}
# La versión (app.version) la escribe tools/version.py en version.properties, que va dentro del jar.
spring.config.import=optional:classpath:version.properties

# --- Autenticación ---
# Secreto con el que se firman los tokens JWT (mínimo 32 caracteres; si no, el backend no arranca) y horas
# que dura una sesión (168 = 7 días). El primer administrador (ADMIN_ID, ADMIN_NOMBRE, ADMIN_APELLIDOS,
# ADMIN_CORREO y ADMIN_PASSWORD) lo lee AdminInicial directamente del entorno.
app.jwt.secreto=${JWT_SECRET:}
app.jwt.horas=${JWT_EXPIRES_HOURS:168}
# Minutos de vigencia del token del video de la pantalla de revisión (120 = 2 horas): es de solo lectura y de
# un solo análisis, y va en la URL del <video> (?vt=), por eso dura poco.
app.video.minutos=${VIDEO_TOKEN_MINUTES:120}
# Minutos de vigencia del enlace para restablecer la contraseña (60 por omisión). El enlace sirve una sola vez: lleva una huella
# del hash de la contraseña y, en cuanto esta cambia, deja de servir.
app.reset.minutos=${RESET_LINK_MINUTES:60}
# Dirección de la web, para armar los enlaces de los correos (restablecer contraseña y primer acceso). Si está vacía, se usa el
# primer origen de CORS_ORIGINS, que es la dirección desde donde se abre la web (DireccionWeb).
app.web.url=${WEB_URL:}
# Píxeles que un borde del recuadro tiene que moverse, como mínimo, para contar como ajuste (si no, el backend responde
# 422: «el recuadro casi no cambió»). Con 3 px, un movimiento de 3 px o menos ya no es un ajuste.
app.pausa.umbral-recuadro-px=${PAUSA_UMBRAL_RECUADRO_PX:3}
# Páginas que pueden llamar a la API desde un navegador (CORS), separadas por comas. Por omisión, el
# frontend de desarrollo; el compose de la versión portable pone la dirección de su nginx.
app.cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# --- Swagger ---
# Sin paths-to-match springdoc documenta todas las rutas, también las que se agreguen después.
# SWAGGER_HABILITADO=false (el compose definitivo, en producción) apaga la documentación: /v3/api-docs y la página dan 404.
# El compose de desarrollo y la ejecución suelta la dejan prendida (true por omisión).
springdoc.api-docs.enabled=${SWAGGER_HABILITADO:true}
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:true}
springdoc.swagger-ui.path=/documentacion/swagger-ui.html

# --- Correo ---
# En desarrollo va a MailHog (localhost:1025, sin usuario ni cifrado) y los correos se ven en
# http://localhost:8025. Para Gmail: SMTP_HOST=smtp.gmail.com, SMTP_PORT=587, SMTP_AUTH=true,
# SMTP_STARTTLS=true y en SMTP_PASSWORD la contraseña de aplicación, como en la práctica.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
# Propiedad propia (no es de Spring): el remitente de los correos. La lee EmailServiceImpl.
app.correo.remitente=${SMTP_FROM:no-reply@fst.local}
