<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FST · Detalle de grupo</title>
<link rel="stylesheet" href="assets/modernist.css">
<link rel="stylesheet" href="assets/fst.css">
<script src="assets/app.js"></script>
<script src="assets/data.js"></script>
<style>
  .thumb{width:82px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;font-size:8.5px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <!-- 2d · Detalle de grupo -->
  <nav class="nav" data-user="MR">
    <span class="nav-brand" style="margin-right:0"><a href="experimentos.html" style="font-size:inherit">FST</a></span>
    <span class="crumbs"><a href="experimentos.html">Experimentos</a> / <a href="experimento.html" id="crumbExp"></a> / <span class="here" id="crumbGrupo"></span></span>
  </nav>

  <div class="page">
    <div style="margin-bottom:6px">
      <h2 style="margin:0 0 9px"><span id="titulo"></span> <span class="tag" id="tipo" style="vertical-align:middle;margin-left:8px"></span></h2>
      <div style="display:flex;gap:24px;font-size:13px;color:var(--muted-2)"><span id="trat"></span><span class="num" id="nEsp"></span><span class="num" id="nTandas"></span></div>
    </div>

    <hr class="hr">

    <div id="tandas" style="display:flex;flex-direction:column;gap:2px;background:var(--color-divider);border:1px solid var(--color-divider)"></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const { experimento: exp, groups, ESTADO } = FST_DATA;
  const gid = new URLSearchParams(location.search).get('g') || 'G-01';
  const g = groups.find(x => x.id === gid) || groups[0];
  const nombreGrupo = g.tipo === 'control' ? 'Grupo control' : g.nombre;

  document.title = 'FST · ' + nombreGrupo;
  $('crumbExp').textContent = exp.titulo;
  $('crumbGrupo').textContent = nombreGrupo;
  $('titulo').textContent = nombreGrupo;
  $('tipo').textContent = g.tipo; $('tipo').classList.add(g.tipoTag);
  $('trat').textContent = g.trat;
  $('nEsp').textContent = g.n + ' especímenes';
  $('nTandas').textContent = g.tandas.length + ' tandas · ' + g.reparto.join(' + ') + ' cilindros';

  // Notas de Día 2 según su estado (textos del mockup, 2d y 2e).
  const D2 = {
    'Completado': { nota: 'Video principal del sistema. Analizado completo.', analisis: 'Análisis vigente: 24 feb 2026' },
    'En cola': { nota: 'En espera de turno en la cola: un trabajo a la vez.', analisis: 'Sin análisis todavía' },
    'Procesando': { nota: 'Seguimiento de especímenes · en curso · 75 %', analisis: 'Sin análisis todavía' },
    'Error': { nota: 'E-DET-070 · Confianza de detección 0.54, menor a 0.70: no se detectaron los cuatro cilindros.', analisis: 'Sin análisis todavía' }
  };
  // Día 1 solo existe en la Tanda A del grupo control (mockup 2d).
  const conD1 = (grupo, t) => grupo.id === 'G-01' && t.letra === 'A';

  const tag = (est) => { const e = ESTADO[est]; return '<span class="tag ' + e.cls + '" style="white-space:nowrap;background:' + e.bg + ';color:' + e.fg + '">' + est + '</span>'; };

  $('tandas').innerHTML = g.tandas.map(t => {
    const d1 = conD1(g, t), d2 = D2[t.estado];
    const esp = Array.from({ length: t.cuantos }, (_, i) =>
      '<div style="background:var(--color-bg);display:flex;align-items:center;gap:11px;padding:11px 12px">' +
        '<span class="num nd" style="width:28px;height:28px;flex:none;border:2px solid var(--color-accent);color:var(--color-accent-700);display:flex;align-items:center;justify-content:center;font-size:11px">P' + (i + 1) + '</span>' +
        '<div class="nd" style="font-size:12.5px;white-space:nowrap">Cilindro P' + (i + 1) + '</div>' +
      '</div>').join('');
    return '<div style="background:var(--color-bg)">' +
      '<div style="display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--color-surface);border-bottom:1px solid var(--color-divider)">' +
        '<span class="nd" style="font-size:16px">' + t.nombre + '</span>' +
        '<span class="num" style="font-size:11.5px;color:var(--muted)">18–19 feb 2026</span>' +
        '<div style="flex:1"></div>' + tag(t.estado) +
      '</div>' +
      '<div style="display:grid;grid-template-columns:410px 1fr">' +
        '<div style="padding:18px 20px;border-right:2px solid var(--color-divider)">' +
          '<div class="k" style="margin-bottom:13px">Cilindros de la tanda</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--color-divider);border:1px solid var(--color-divider)">' + esp + '</div>' +
        '</div>' +
        '<div style="padding:18px 20px">' +
          '<div class="k" style="margin-bottom:13px">Videos de la tanda</div>' +
          '<div style="display:flex;flex-direction:column;gap:2px;background:var(--color-divider);border:1px solid var(--color-divider)">' +
            '<div style="background:' + (d1 ? 'var(--color-bg)' : 'var(--color-surface)') + ';display:flex;align-items:center;gap:16px;padding:14px 15px;opacity:' + (d1 ? '1' : '.55') + '">' +
              '<div class="thumb grayscale" style="background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--color-text) 16%,transparent) 0 5px,transparent 5px 10px);color:color-mix(in srgb,var(--color-text) 60%,transparent)">cuadro<br>día 1</div>' +
              '<div style="flex:1">' +
                '<div class="nd" style="font-size:13.5px">Día 1 · sesión de estrés <span style="font-weight:400;font-family:var(--font-body);color:var(--muted)">20 min</span></div>' +
                '<div style="font-size:12px;line-height:1.55;margin-top:3px;color:color-mix(in srgb,var(--color-text) 70%,transparent)">' + (d1 ? 'Se analizan sus primeros 5 minutos.' : 'Sin video de Día 1 (opcional)') + '</div>' +
              '</div>' + (d1 ? tag('Completado') : '') +
            '</div>' +
            '<div style="background:var(--color-accent-100);display:flex;align-items:center;gap:16px;padding:14px 15px;border-left:4px solid var(--color-accent)">' +
              '<div class="thumb grayscale" style="background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--color-accent) 34%,transparent) 0 5px,transparent 5px 10px);color:var(--color-accent-800)">cuadro<br>día 2</div>' +
              '<div style="flex:1">' +
                '<div class="nd" style="font-size:13.5px">Día 2 · evaluación <span style="font-weight:400;font-family:var(--font-body);color:var(--muted)">5 min · 24 h después</span></div>' +
                '<div style="font-size:12px;line-height:1.55;margin-top:3px;color:color-mix(in srgb,var(--color-text) 70%,transparent)">' + d2.nota + '</div>' +
              '</div>' + tag(t.estado) +
            '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:12px;margin-top:12px;font-size:11.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)">' +
            '<span>' + d2.analisis + '</span><div style="flex:1"></div>' +
            (t.estado === 'Completado' ? '<a href="resultados.html">Ver resultados</a>' : t.estado === 'Error' || t.estado === 'Procesando' || t.estado === 'En cola' ? '<a href="progreso.html">Ver progreso del análisis →</a>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
</script>
</body>
</html>
