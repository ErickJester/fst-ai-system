# nginx del frontend en producción (lo usa Dockerfile.prod).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los videos de una tanda pueden pesar varios GB. Ajustar si el laboratorio fija otro límite.
    client_max_body_size 10g;

    # Para el healthcheck del contenedor.
    location = /salud {
        access_log off;
        return 200 "ok\n";
    }

    # /api/... se reenvía al backend sin el prefijo /api (la API usa /auth/login, /experiments…).
    # Así el navegador habla con un solo origen: sin CORS y sin «localhost» de por medio.
    # El nombre «api» se resuelve al recibir la petición (resolver de Docker), para que nginx
    # arranque aunque el backend todavía no exista o esté apagado.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subidas de video: se envían al backend según llegan, sin acumularlas en disco.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Archivos con huella en el nombre (los genera Vite): se pueden guardar en caché un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de la app (/experimentos/EXP-2026-02, /restablecer?token=…): siempre index.html,
    # que el navegador no debe guardar en caché para recibir cada versión nueva.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
