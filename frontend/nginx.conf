# nginx del frontend en producción (lo usa Dockerfile.prod).

# Registro SIN la cadena de consulta: ni $args ni $request (que la incluye). El video de la revisión se pide
# con un token en la URL (?vt=) y no debe quedar escrito en el registro.
log_format sin_args '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /dev/stdout sin_args;

    # Sin el número de versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # Cabeceras de seguridad. «always» las pone también en los errores. OJO: en nginx, si un location declara su propio
    # add_header, deja de heredar los del server; por eso /assets/ y / las repiten. No hay Content-Security-Policy: la
    # página usa estilos en línea y una CSP estricta la rompería.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los videos de una tanda pueden pesar varios GB. Ajustar si el laboratorio fija otro límite.
    client_max_body_size 2048m;

    # Para el healthcheck del contenedor.
    location = /salud {
        access_log off;
        return 200 "ok\n";
    }

    # El video de la revisión (GET /experiments/{id}/analyses/{idAnalisis}/video?vt=...) va en su propio location, con la
    # misma configuración de proxy que /api/, solo para darle otro error_log. El error_log de nginx no acepta log_format y,
    # cuando falla el backend (apagado, tiempo agotado), escribe la línea de la petición COMPLETA, con el ?vt= (el token del
    # video). Con «crit» no se registran esos errores (upstream falla en «error»). A cambio, los fallos de ESTA ruta no
    # quedan en el registro de nginx; sí en el de Spring, que no escribe la query. El resto de /api/ conserva su registro.
    # Un location con expresión regular gana a /api/, que es de prefijo. Range y el 206 pasan igual (el proxy no los toca).
    location ~ ^/api/experiments/\d+/analyses/\d+/video$ {
        error_log /dev/stderr crit;
        resolver 127.0.0.11 valid=30s;
        set $backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        # $http_host (y no $host) conserva el puerto que escribió el navegador: sin él Spring ve el Origin
        # (http://192.168.x.y:8088) como otro origen y responde 403 «Invalid CORS request» desde otras PCs de la red.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spring ya manda estas cabeceras; se descartan y nginx pone las suyas (las del server), para no repetirlas.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /api/... se reenvía al backend sin el prefijo /api (la API usa /auth/login, /experiments…).
    # Así el navegador habla con un solo origen: sin CORS y sin «localhost» de por medio.
    # El nombre «api» se resuelve al recibir la petición (resolver de Docker), para que nginx
    # arranque aunque el backend todavía no exista o esté apagado.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        # $http_host: ver el comentario del location del video.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        # Subidas de video: se envían al backend según llegan, sin acumularlas en disco.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Archivos con huella en el nombre (los genera Vite): se pueden guardar en caché un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Rutas de la app (/experimentos/EXP-2026-02, /restablecer?token=…): siempre index.html,
    # que el navegador no debe guardar en caché para recibir cada versión nueva.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
