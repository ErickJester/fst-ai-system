# Revisa el frontend en cada push y en cada pull request que lo toque: revisión del código
# (lint), pruebas automáticas y compilación. Si algo falla, GitHub lo marca en rojo.
name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar el código (ESLint)
        run: npm run lint
      - name: Pruebas automáticas (Vitest)
        run: npm test
      - name: Compilar (Vite)
        run: npm run build
